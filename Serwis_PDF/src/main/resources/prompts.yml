persondata:
  |-
    Wyodrębnij z poniższego tekstu wszystkie dane potrzebne do utworzenia obiektu PersonData. Jeśli znajdziesz oczywiste literówki lub błędy w danych (np. imię 'mrek' zamiast 'Marek'), popraw je. Jeżeli niektóre wartości nie są podane dosłownie, spróbuj je wywnioskować na podstawie analizy tekstu, ale nie zgaduj i nie generuj danych bez uzasadnienia w treści. Odpowiadaj wyłącznie w formacie JSON, zgodnie z poniższym wzorem. Jeśli nie możesz znaleźć lub wywnioskować jakiejś wartości, ustaw ją na null. Przykład odpowiedzi:
    {
      "firstName": "Jan",
      "lastName": "Kowalski",
      "pesel": "12345678901",
      "numer_telefonu": "123456789",
      "ryzykoZgonu": 1,
      "dataPrzyjecia": "2024-06-01",
      "szpital": "Szpital Miejski",
      "oddzial": "Kardiologia",
      "lekarzProwadzacy": "dr Anna Nowak",
      "miejsceHospitalizacji": 0,
      "dataWypisu": "2024-06-10",
      "czasHospitalizacji": 9,
      "plec": 0,
      "wiek": 45,
      "masaCiala": 80.5,
      "wzrost": 180.0,
      "bmi": 24.8
    }
    Odpowiadaj tylko JSON, bez żadnych dodatkowych komentarzy ani tekstu.
persondataextended:
  |-
    Wyodrębnij z poniższego tekstu wszystkie dane potrzebne do utworzenia obiektu PersonDataExtended. W przykładzie poniżej przy każdym polu znajduje się krótki komentarz wyjaśniający możliwe wartości, skopiowany bezpośrednio z opisu pól w formularzu. W odpowiedzi nie mogą pojawiać się żadne literówki w nazwach pól – nazwy muszą być identyczne jak w poniższym przykładzie (np. "udarNiedokrwienny6mies", a nie "udzarNiedokrwienny6mies"). Jeśli znajdziesz oczywiste literówki lub błędy w danych, popraw je. Jeżeli niektóre wartości nie są podane dosłownie, spróbuj je wywnioskować na podstawie analizy tekstu, ale nie zgaduj i nie generuj danych bez uzasadnienia w treści. Odpowiadaj wyłącznie w formacie JSON, zgodnie z poniższym wzorem. Jeśli nie możesz znaleźć lub wywnioskować jakiejś wartości, ustaw ją na null. Przykład odpowiedzi:
    {
      "lastName": "Kowalski", // Nazwisko
      "firstName": "Jan", // Imię
      "pesel": "12345678901", // PESEL
      "czasTrwaniaObjawow": "12h", // Czas trwania objawów [w godzinach (h) lub dniach (dni)]
      "nzk": 0, // Zatrzymanie krążenia (NZK) [0-nie; 1-tak]
      "wstrzas": 1, // Wstrząs [0-nie; 1-tak]
      "omdlenie": 0, // Omdlenie/Zasłabnięcie [0-nie; 1-tak]
      "dusznosc": 1, // Duszność [0-nie; 1-tak]
      "bolWKlatce": 1, // Ból w klatce piersiowej [0-nie; 1-tak]
      "zmniejszenieTolerancji": 1, // Zmniejszenie tolerancji wysiłku/Osłabienie [0-nie; 1-tak]
      "kaszel": 0, // Kaszel [0-nie; 1-tak]
      "krwioplucie": 0, // Krwioplucie [0-nie; 1-tak]
      "zaburzeniaSwiadomosci": 0, // Zaburzenia świadomości [0-nie; 1-tak]
      "inneObjawy": "brak", // Inne objawy [proszę o wypisanie innych objawów, które udało się zidentyfikować w Karcie Informacyjnej]
      "chorobyWspolistniejace": "nadciśnienie, cukrzyca", // Choroby współistniejące [tekst]
      "zakrzepicaAktualna": 0, // Aktualna zakrzepica żył głębokich kończyn dolnych [0-nie; 1- tak]
      "lokalizacjaZakrzepu": "brak", // Lokalizacja zakrzepu w żyłach głębokich kończyn dolnych [tekst]
      "zakrzepicaProksymalna": 0, // Zakrzepica proksymalna, czyli dotycząca żył podkolanowych, żył udowych, żył biodrowych lub żyły głównej dolnej [0-nie, 1- tak]
      "zatorowoscPlucnaWPrzeszlosci": 0, // Zatorowość płucna w przeszłości [0- nie; 1-tak]
      "zakrzepicaWPrzeszlosci": 0, // Zakrzepica żył głębokich kończyn dolnych w przeszłości [0-nie, 1 - tak]
      "alloplastyka": 0, // Zabieg alloplastyki / endoprotezoplastyki stawu biodrowego lub kolanowego [0-nie, 1 - tak]
      "zlamanie": 0, // Złamanie kości kończyny dolnej [0-nie, 1 - tak]
      "powaznyUraz6mies": 0, // Poważny uraz w ciągu ostatnich 6 miesięcy [0-nie, 1 - tak]
      "urazRdzenia": 0, // Uraz rdzenia kręgowego w przeszłości [0-nie, 1 - tak]
      "hospitalizacjaMigotanie12mies": 0, // Hospitalizacja z powodu migotania przedsionków lub trzepotania przedsionków lub przewlekłej niewydolności serca w ciągu ostatnich 12 miesięcy[0-nie, 1 - tak]
      "zawal3mies": 0, // Zawał mięśnia sercowego w ciągu ostatnich 3 miesięcy [0-nie, 1 - tak]
      "artroskopia6mies": 0, // Artroskopia stawu kolanowego w ciągu ostatnich 6 miesięcy [0-nie, 1 - tak]
      "antykoncepcja": 0, // Przyjmowanie doustnej antykoncepcji [0-nie, 1 - tak]
      "hormonalnaTerapia": 0, // Przyjmowanie hormonalnej terapii zastępczej [0-nie, 1 - tak]
      "inVitro12mies": 0, // Procedura in vitro w ciągu ostatnich 12 miesięcy [0-nie, 1 - tak]
      "poloz": 0, // Połóg (poród / cięcie cesarskie w ciągu ostatnich 6 tygodni) [0-nie, 1 - tak]
      "przetoczenieKKCzMiesiac": 0, // Przetoczenie koncentratu krwinek czerwonych (KKCz) w ciągu ostatniego miesiąca [0-nie, 1 - tak]
      "erytropoezaMiesiac": 0, // Podawanie czynników stymulujących erytropoezę w ciągu ostatniego miesiąca [0-nie, 1 - tak]
      "cewnikCentralny": 0, // Wkłucie centralne lub cewnik centralny (np. do karmienia pozajelitowego / chemioterapii) [0-nie, 1 - tak]
      "elektrodyZylne": 0, // Elektrody w układzie żylnym (np. od rozrusznika serca / kardiostymulatora) [0-nie, 1 - tak]
